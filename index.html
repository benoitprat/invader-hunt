<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Invader Hunt</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Invaders">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="map"></div>

<div id="topbar">
  <input id="search" type="search" placeholder="🎯 Aller à… (adresse, lieu)" autocomplete="off">
  <button id="btn-settings" title="Réglages">⚙️</button>
</div>
<div id="search-results" hidden></div>

<div id="fabs">
  <button id="btn-north" title="Remettre au nord" hidden><span id="north-arrow">⬆️</span></button>
  <button id="btn-locate" title="Ma position">📍</button>
  <button id="btn-rando" title="Rando invaders">🥾</button>
  <button id="btn-layers" title="Affichage">👾</button>
</div>

<div id="rando-panel" hidden>
  <h3>🥾 Rando invaders</h3>
  <div class="radio-row zone-row">
    <label><input type="radio" name="rando-zone" value="arr" checked> 🏙️ Arrondissement</label>
    <label><input type="radio" name="rando-zone" value="radius"> ⭕ Autour d'un point</label>
  </div>
  <label id="rando-arr-wrap">Arrondissement
    <select id="rando-arr"></select>
  </label>
  <label id="rando-radius-wrap" hidden>Rayon autour du point (🚩 départ manuel, sinon ma position, sinon le centre de la carte)
    <select id="rando-radius">
      <option value="250">250 m</option>
      <option value="500" selected>500 m</option>
      <option value="1000">1 km</option>
      <option value="2000">2 km</option>
    </select>
  </label>
  <label>Distance visée
    <select id="rando-dist">
      <option value="3">3 km</option>
      <option value="5" selected>5 km</option>
      <option value="8">8 km</option>
      <option value="12">12 km</option>
    </select>
  </label>
  <div class="radio-row">
    <label><input type="radio" name="rando-type" value="loop" checked> 🔄 Boucle</label>
    <label><input type="radio" name="rando-type" value="line"> ➡️ Traverse</label>
  </div>
  <div class="row">
    <button id="btn-rando-go">Générer</button>
    <button id="btn-rando-close">Fermer</button>
  </div>
</div>

<div id="layers-panel" hidden>
  <button id="btn-layers-close" title="Fermer">✕</button>
  <label class="sel-row first">Couleurs
    <select id="color-mode">
      <option value="status">Statut (classique)</option>
      <option value="value">Valeur en points</option>
    </select>
  </label>
  <div id="value-legend" hidden></div>
  <label><input type="checkbox" id="chk-unflashed" checked> <i class="sw" id="sw-todo"></i> 🎯 À flasher</label>
  <label><input type="checkbox" id="chk-flashed" checked> <i class="sw" id="sw-flashed"></i> Déjà flashés</label>
  <label><input type="checkbox" id="chk-destroyed"> <i class="sw" id="sw-dead"></i> 💥 Détruits</label>
  <label><input type="checkbox" id="chk-hidden"> <i class="sw" id="sw-hidden"></i> 🙈 Cachés</label>
  <label class="sel-row">Valeur minimale
    <select id="min-pts">
      <option value="0" selected>toutes</option>
      <option value="20">≥ 20 pts</option>
      <option value="30">≥ 30 pts</option>
      <option value="40">≥ 40 pts</option>
      <option value="50">≥ 50 pts</option>
      <option value="100">100 pts</option>
    </select>
  </label>
</div>

<div id="settings-panel" hidden>
  <h3>Réglages</h3>
  <label>UID FlashInvaders
    <input id="uid-input" type="text" spellcheck="false">
  </label>
  <div class="row">
    <button id="btn-refresh-flash">🔄 Recharger mes flashs</button>
    <button id="btn-close-settings">Fermer</button>
  </div>
  <p id="flash-status" class="muted"></p>
  <p id="build-info" class="muted"></p>
  <p id="db-info" class="muted"></p>
  <label class="chk-row"><input type="checkbox" id="chk-releve"> 👾 Mode relevé — noter un invader absent de la base</label>
  <p id="releves-info" class="muted"></p>
  <div class="row" id="releves-actions" hidden>
    <button id="btn-releves-copy">📋 Copier</button>
    <button id="btn-releves-clear">🗑️ Effacer</button>
  </div>
</div>

<div id="route-panel" hidden>
  <button id="btn-route-min" title="Réduire / agrandir">▾</button>
  <div id="route-summary"></div>
  <div id="route-list"></div>
  <div class="row">
    <button id="btn-clear-route">✖️ Effacer</button>
  </div>
</div>

<div id="toast" hidden></div>

<script src="vendor/leaflet.js"></script>
<script src="vendor/leaflet-rotate.js"></script>
<script src="version.js"></script>
<script src="app.js"></script>
</body>
</html>
